services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ce50-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - DB_PATH=/app/ce50.db
      - UPLOAD_DIR=static/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    volumes:
      - sqlite_data:/app/dbdata
      - uploads_data:/app/static/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ce50-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  sqlite_data:
  uploads_data:
