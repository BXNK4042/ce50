services:
  nginx:
    image: nginx:alpine
    container_name: ce50-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
      - ./server/video:/var/www/video:ro
      - ./docker/logs:/var/log/nginx
    depends_on:
      - api
      - web

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ce50-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - DB_PATH=/app/ce50.db
      - UPLOAD_DIR=/app/static/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    volumes:
      - sqlite_data:/app/dbdata
      - uploads_data:/app/static/uploads
      - ./server/image:/app/initial_images:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: ce50-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  sqlite_data:
  uploads_data:

